name: APK de debug

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Gerar APK de debug
    runs-on: ubuntu-latest
    permissions:
      # Para o GITHUB_TOKEN poder criar e atualizar a release.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Este projeto tem o gradlew e o gradle-wrapper.jar versionados, entao
      # nao precisa instalar o Gradle a parte: o wrapper baixa a versao certa.
      - name: Liberar o gradlew
        run: chmod +x ./gradlew

      # O projeto assina com uma chave propria, em debug.keystore, que nao
      # vai no repositorio. Sem ela a compilacao para antes de comecar - foi
      # o que derrubou os dois ultimos builds.
      #
      # Com o segredo DEBUG_KEYSTORE_B64 a chave e sempre a MESMA, e ai a
      # atualizacao instala por cima da versao que ja esta no aparelho. Sem
      # ele, uma chave nova a cada build: compila, mas so instala depois de
      # desinstalar a anterior.
      - name: Preparar a chave de assinatura
        env:
          CHAVE: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "$CHAVE" | base64 -d > debug.keystore
            echo "Chave fixa, vinda do segredo do repositorio."
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "AVISO: chave nova neste build. A atualizacao nao vai instalar por cima."
          fi

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/*.apk FilmeMeu.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FilmeMeu-apk
          path: FilmeMeu.apk
          retention-days: 30

      # A release rolante da um endereco de download fixo, que o artefato nao
      # tem. So em push: um pull request de fora nao deve publicar release.
      - name: Publicar APK na release apk-latest
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="APK de debug do commit ${GITHUB_SHA:0:7}, gerado em $(date -u '+%d/%m/%Y %H:%M UTC')."
          gh release create apk-latest \
            --target "$GITHUB_SHA" \
            --title "APK de debug (ultimo build)" \
            --notes "$notes" \
            --prerelease \
            || gh release edit apk-latest --notes "$notes"
          gh release upload apk-latest FilmeMeu.apk --clobber
